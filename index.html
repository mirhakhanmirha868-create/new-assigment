<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>

    <link rel="stylesheet" href="style.css">

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header>
        <h2>Ecommerce</h2>

        <div id="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span id="count">0</span>
        </div>
    </header>

    <!-- Products -->
    <section class="shop">

        <h1>Shop Products</h1>

        <div class="product-content">

            <!-- Product 1 -->
            <div class="product-box">
                <img src="images/img 1.jpeg" alt="">
                <h3>Casual Black Polo</h3>

                <div class="price-cart">
                    <span>$100</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-box">
                <img src="images/img 2.jpeg" alt="">
                <h3>Waterproof Hoodie</h3>

                <div class="price-cart">
                    <span>$50</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="product-box">
                <img src="images/img 3.jpeg" alt="">
                <h3>Blue Sweatshirt</h3>

                <div class="price-cart">
                    <span>$20</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="product-box">
                <img src="images/img 4.jpeg" alt="">
                <h3>Hooded Jacket</h3>

                <div class="price-cart">
                    <span>$125</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 5 -->
            <div class="product-box">
                <img src="images/img 5.jpeg" alt="">
                <h3>Grey Jacket</h3>

                <div class="price-cart">
                    <span>$80</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 6 -->
            <div class="product-box">
                <img src="images/img 6.jpeg" alt="">
                <h3>navy sweater</h3>

                <div class="price-cart">
                    <span>$60</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 7 -->
            <div class="product-box">
                <img src="images/img 7.jpeg" alt="">
                <h3>Green Hoodie</h3>

                <div class="price-cart">
                    <span>$90</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

            <!-- Product 8 -->
            <div class="product-box">
                <img src="images/img 8.jpeg" alt="">
                <h3>Yellow Polo</h3>

                <div class="price-cart">
                    <span>$40</span>
                    <i class="ri-shopping-bag-line add-cart"></i>
                </div>
            </div>

        </div>

    </section>

    <!-- Cart -->
    <div class="cart">

        <h2>Your Cart</h2>

        <i class="ri-close-line" id="close-cart"></i>

        <div class="cart-content">

        </div>

        <div class="total">
            <h3>Total: $0</h3>
        </div>

        <button>Buy Now</button>

    </div>

    <script src="app.js"></script>

</body>
</html>
